```html

<html lang="th">
<head>

    <style>
        :root {
            color-scheme: light;
            --ink: #202b2a;
            --muted: #687674;
            --paper: #ffffff;
            --canvas: #eff5f2;
            --line: #d7e2de;
            --red: #d9433b;
            --yellow: #f4ca50;
            --teal: #21766d;
            --font-body: "Space Grotesk", sans-serif;
            --font-display: "Bungee", "Space Grotesk", sans-serif;

        }

        body {
            min-width: 320px;
            margin: 0;
            color: var(--ink);

                linear-gradient(90deg, rgb(32 43 42 / 3%) 1px, transparent 1px);

        button,

        select {
            font: inherit;
        }

        .masthead {
            position: relative;
            overflow: hidden;
            color: white;
            background: var(--red);
            border-bottom: 5px solid var(--ink);
        }

            position: absolute;

            bottom: 0;

            height: 8px;
            background: var(--yellow);
            content: "";
        }

        }

        .brand-ball {

            background: var(--yellow);

        .detail-header h2,

        @media (max-width: 600px) {
            .masthead-inner,

                width: min(100% - 28px, 1160px);

                min-height: 96px;

                gap: 10px;
            }

            .brand-ball {
                width: 38px;

            }

            }

            }

                width: 108px;

            }

                padding: 15px;
            }

        @media (prefers-reduced-motion: reduce) {
            *,

    </style>
</head>

<body>

    <header class="masthead">
        <div class="masthead-inner">
            <div class="brand">
                <span class="brand-ball" aria-hidden="true"></span>
                <div>
                    <h1>Pokédex</h1>
                    <p>National collection</p>
                </div>
            </div>
            <div class="edition-tag">
                <span class="live-mark">Live API</span>
                <strong>001 — 1025</strong>
            </div>
        </div>
    </header>

    <main>
        <section class="collection-heading" aria-labelledby="collectionTitle">
            <div>
                <p class="eyebrow">01 / Collection</p>
                <h2 id="collectionTitle">All Pokémon</h2>
            </div>
            <p id="resultSummary" role="status" aria-live="polite">Loading...</p>
        </section>

        <section class="toolbar" aria-label="Pokémon filters">
            <label class="field search-field" for="search">
                <span>Search</span>
                <input type="search" id="search" placeholder="Name or Pokédex number...">
            </label>
            <label class="field sort-field" for="sort">
                <span>Sort by</span>
                <select id="sort">
                    <option value="az">Name A → Z</option>
                    <option value="za">Name Z → A</option>
                    <option value="number-asc">Number low to high</option>
                    <option value="number-desc">Number high to low</option>
                </select>
            </label>
        </section>

        <div id="pokemonList"></div>
    </main>

    <dialog id="pokemonDialog" aria-labelledby="detailName">
        <div class="detail-header">
            <div>
                <p id="detailNumber"></p>
                <h2 id="detailName"></h2>
            </div>
            <button id="closeDialog" type="button" aria-label="Close">×</button>
        </div>
        <div class="move-controls">
            <label>
                Game version
                <select id="versionFilter">
                    <option value="">All versions</option>
                </select>
            </label>
            <label>
                Search moves
                <input id="moveSearch" type="search" placeholder="Move name...">
            </label>
        </div>
        <p id="moveStatus" role="status" aria-live="polite"></p>
        <div class="move-table-wrap">
            <table id="moveTable">
                <thead>
                    <tr>
                        <th>Move</th>
                        <th>Learn method</th>
                        <th>Level</th>
                        <th>Version</th>
                    </tr>
                </thead>
                <tbody id="moveRows"></tbody>
            </table>
        </div>
    </dialog>

    <script>
        let pokemonList = [];
        let activePokemon = null;
        let activeRequest = 0;
        const pokemonDetails = new Map();

        // ดึงข้อมูลจาก PokéAPI
        async function loadPokemon() {

            const response = await fetch(
                "https://pokeapi.co/api/v2/pokemon?limit=1025"
            );

            const data = await response.json();

            pokemonList = data.results;

            displayPokemon();
        }


        // =========================
        // SEARCH
        // =========================

        function searchPokemon() {

            const searchText =
                document.getElementById("search").value.toLowerCase();

            const result = pokemonList.filter(pokemon =>
                pokemon.name.toLowerCase().includes(searchText) ||
                pokemon.url.split("/")[6].includes(searchText)
            );

            displayPokemon(result);
        }


        // =========================
        // SORT
        // =========================

        function sortPokemon(list) {

            const sortType =
                document.getElementById("sort").value;

            if (sortType === "number-asc") {

                list.sort((a, b) =>
                    Number(a.url.split("/")[6]) - Number(b.url.split("/")[6])
                );

            } else if (sortType === "number-desc") {

                list.sort((a, b) =>
                    Number(b.url.split("/")[6]) - Number(a.url.split("/")[6])
                );

            } else if (sortType === "az") {

                list.sort((a, b) =>
                    a.name.localeCompare(b.name)
                );

            } else {

                list.sort((a, b) =>
                    b.name.localeCompare(a.name)
                );
            }

            return list;
        }


        // =========================
        // DISPLAY
        // =========================

        function displayPokemon(list = pokemonList) {

            const container =
                document.getElementById("pokemonList");

            container.innerHTML = "";

            // ใช้ Sort ก่อนแสดงผล
            list = sortPokemon([...list]);
            document.getElementById("resultSummary").textContent =
                `${list.length} Pokémon`;

            list.forEach(pokemon => {

                const id =
                    pokemon.url.split("/")[6];

                const card = document.createElement("button");

                card.className = "card";
                card.type = "button";
                card.setAttribute("aria-label", `Show moves for ${pokemon.name}`);

                card.innerHTML = `
                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png"
                    >

                    <h3>${pokemon.name}</h3>

                    <p>#${id}</p>
                `;

                card.addEventListener("click", () => showPokemonDetails(pokemon));

                container.appendChild(card);
            });
        }


        async function showPokemonDetails(pokemon) {

            const dialog = document.getElementById("pokemonDialog");
            const requestId = ++activeRequest;
            const id = pokemon.url.split("/")[6];

            activePokemon = null;
            document.getElementById("detailName").textContent = pokemon.name;
            document.getElementById("detailNumber").textContent = `#${id}`;
            document.getElementById("moveStatus").textContent = "Loading moves...";
            document.getElementById("moveRows").replaceChildren();
            document.getElementById("moveSearch").value = "";
            document.getElementById("versionFilter").replaceChildren(
                new Option("All versions", "")
            );

            if (!dialog.open) {
                dialog.showModal();
            }

            try {
                let detail = pokemonDetails.get(pokemon.url);

                if (!detail) {
                    const response = await fetch(pokemon.url);

                    if (!response.ok) {
                        throw new Error("Unable to load Pokémon details");
                    }

                    detail = await response.json();
                    pokemonDetails.set(pokemon.url, detail);
                }

                if (requestId !== activeRequest) {
                    return;
                }

                activePokemon = detail;
                const versions = [...new Set(
                    detail.moves.flatMap(({ version_group_details }) =>
                        version_group_details.map(({ version_group }) => version_group.name)
                    )
                )];
                const versionFilter = document.getElementById("versionFilter");

                versions.forEach(version => {
                    versionFilter.add(new Option(version.replaceAll("-", " "), version));
                });

                if (versions.length > 0) {
                    versionFilter.value = versions[versions.length - 1];
                }

                renderPokemonMoves();
            } catch (error) {
                if (requestId === activeRequest) {
                    document.getElementById("moveStatus").textContent =
                        "Could not load moves. Please try again.";
                }
            }
        }


        function renderPokemonMoves() {

            if (!activePokemon) {
                return;
            }

            const selectedVersion = document.getElementById("versionFilter").value;
            const searchText = document.getElementById("moveSearch").value.toLowerCase();
            const moves = activePokemon.moves.flatMap(({ move, version_group_details }) =>
                version_group_details
                    .filter(detail =>
                        (!selectedVersion || detail.version_group.name === selectedVersion) &&
                        move.name.includes(searchText)
                    )
                    .map(detail => ({
                        name: move.name,
                        method: detail.move_learn_method.name,
                        level: detail.level_learned_at,
                        version: detail.version_group.name
                    }))
            ).sort((a, b) => a.name.localeCompare(b.name));

            const rows = document.getElementById("moveRows");
            rows.replaceChildren();

            moves.forEach(move => {
                const row = document.createElement("tr");

                [
                    move.name.replaceAll("-", " "),
                    move.method.replaceAll("-", " "),
                    move.level || "-",
                    move.version.replaceAll("-", " ")
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                rows.appendChild(row);
            });

            document.getElementById("moveStatus").textContent = moves.length
                ? `${moves.length} moves found`
                : "No moves found.";
        }


        document.getElementById("closeDialog").addEventListener("click", () => {
            document.getElementById("pokemonDialog").close();
        });

        document.getElementById("versionFilter").addEventListener("change", renderPokemonMoves);
        document.getElementById("moveSearch").addEventListener("input", renderPokemonMoves);


        // เมื่อพิมพ์ Search
        document
            .getElementById("search")
            .addEventListener("input", searchPokemon);


        // เมื่อเปลี่ยน Sort
        document
            .getElementById("sort")
            .addEventListener("change", searchPokemon);


        // เริ่มโหลดข้อมูล
        loadPokemon();

    </script>

</body>
</html>
